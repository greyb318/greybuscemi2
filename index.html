<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Showcase</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Include Three.js & GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/loaders/GLTFLoader.js"></script>
    <script>
        // Setup scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.AmbientLight(0xffffff, 1);
        scene.add(light);

        // Load 3D Model
        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://greyb318.github.io/greybuscemi2/KNITWEBSITETEST.glb', // Update with correct path
            function (gltf) {
                console.log("Model loaded!");
                scene.add(gltf.scene);
            },
            undefined,
            function (error) {
                console.error("Error loading model:", error);
            }
        );

        // Camera position
        camera.position.set(0, 2, 5);

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - GLTFloader + compressed</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			Loading 3D Model...
		</div>

		<div id="loading">
			<div class="spinner"></div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.162.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
			import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

			let camera, scene, renderer, controls;

			init();
			render();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1;
				container.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 5000 );
				camera.position.set( 0, 50, 100 );

				const environment = new RoomEnvironment();
				const pmremGenerator = new THREE.PMREMGenerator( renderer );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );  // Black background
				scene.environment = pmremGenerator.fromScene( environment ).texture;
				environment.dispose();

				const grid = new THREE.GridHelper( 1000, 20, 0x444444, 0x444444 );
				grid.material.opacity = 0.5;
				grid.material.depthWrite = false;
				grid.material.transparent = true;
				scene.add( grid );

				const ktx2Loader = new KTX2Loader()
					.setTranscoderPath( 'https://unpkg.com/three@0.162.0/examples/jsm/libs/basis/' )
					.detectSupport( renderer );

				// Add loading manager
				const loadingManager = new THREE.LoadingManager();
				loadingManager.onLoad = function() {
					document.getElementById('loading').style.display = 'none';
					document.getElementById('info').innerHTML = 'Click and drag to rotate. Scroll to zoom.';
				};

				const loader = new GLTFLoader(loadingManager);
				loader.setKTX2Loader( ktx2Loader );
				loader.setMeshoptDecoder( MeshoptDecoder );
				loader.load( './KNITWEBSITETEST.glb', function ( gltf ) {

					const model = gltf.scene;
					
					// Scale up the model
					model.scale.set(10, 10, 10);
					
					// Center the model
					const box = new THREE.Box3().setFromObject(model);
					const center = box.getCenter(new THREE.Vector3());
					
					// Position the model so it's centered and slightly above the grid
					model.position.x = -center.x;
					model.position.z = -center.z;
					model.position.y = 0;

					scene.add(model);

					// Get model dimensions
					const boundingBox = new THREE.Box3().setFromObject(model);
					const size = boundingBox.getSize(new THREE.Vector3());
					
					// Set up camera and controls target based on model center
					const distance = Math.max(size.x, size.y, size.z) * 1.5;
					camera.position.set(distance, distance/2, distance);
					
					controls.target.set(0, size.y/4, 0);  // Set rotation point to 1/4 up the model's height
					controls.update();
					
					camera.lookAt(new THREE.Vector3(0, size.y/4, 0));

					render();

				}, 
				// Progress callback
				function ( xhr ) {
					if (xhr.lengthComputable) {
						const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
						document.getElementById('info').innerHTML = `Loading: ${percent}%`;
					}
				},
				function ( error ) {
					console.error( 'An error occurred loading the model:', error );
					document.getElementById('info').innerHTML = 'Error loading model';
					document.getElementById('loading').style.display = 'none';
				} );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render );
				controls.enableDamping = true;  // Add smooth damping to controls
				controls.dampingFactor = 0.05;
				controls.minDistance = 50;
				controls.maxDistance = 1000;
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				render();
			}

			function render() {
				renderer.render( scene, camera );
			}

		</script>

	</body>
</html>

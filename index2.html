<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - GLB Model</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
    <div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - GLB Model Viewer</div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

        let camera, controls, scene, renderer;

        init();

        function init() {
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 150, 500);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0, 0, 0);

            const pointLight1 = new THREE.PointLight(0xffffff, 3);
            pointLight1.position.set(500, 500, 500);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xffffff, 1);
            pointLight2.position.set(-500, -500, -500);
            scene.add(pointLight2);

            // Load GLB Model
            const loader = new GLTFLoader();
            loader.load(
                'https://raw.githubusercontent.com/greyb318/greybuscemi2/main/KNITWEBSITETEST2.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(50, 50, 50); // Adjust scale as needed
                    scene.add(model);
                },
                undefined,
                function (error) {
                    console.error('Error loading GLB model:', error);
                }
            );

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new TrackballControls(camera, renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
